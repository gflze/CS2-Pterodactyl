name: publish_ubuntu2204
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 1 * *'
jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Running this job only for main branch
    steps:
      - uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Publish Docker image for ubuntu2204 tag
        run: |
              docker build . -t ghcr.io/gflze/cs2-pterodactyl:ubuntu2204 -f docker/Ubuntu2204-Dockerfile
              docker push ghcr.io/gflze/cs2-pterodactyl:ubuntu2204