name: publish_rt3debug
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 1 * *'
jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Running this job only for main branch
    steps:
      - uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Publish Docker image for rt3debug tag
        run: |
              docker build . -t ghcr.io/gflze/cs2-pterodactyl:rt3debug -f docker/RT3Debug-Dockerfile
              docker push ghcr.io/gflze/cs2-pterodactyl:rt3debug